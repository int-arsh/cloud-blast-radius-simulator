name: CI / Quality & Gating Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Ruff Formatting Check
        run: |
          ruff format --check .

      - name: Run Pytest Test Suite with Coverage (>=85%)
        run: |
          pytest --cov=blast_radius --cov-report=term-missing --cov-fail-under=85

      - name: Build Python Distribution Wheel
        run: |
          python -m pip install --upgrade build
          python -m build

  frontend-lint-and-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Oxlint
        run: npm run lint

      - name: Run TypeScript & Vite Production Build
        run: npm run build

  cli-gating-verification:
    name: CLI Blast-Radius Gating Verification
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and package
        uses: astral-sh/setup-uv@v3
      - run: |
          uv pip install --system -e .

      - name: Verify Clean Plan Passes Gate (Exit Code 0)
        run: |
          blast-radius analyze tests/fixtures/add_resource.json --fail-on=blocked

      - name: Verify Dangerous Plan Breaches Gate (Exit Code 1)
        run: |
          if blast-radius analyze tests/fixtures/delete_with_dependents.json --fail-on=review_required; then
            echo "Expected gate failure on destructive plan, but command succeeded!"
            exit 1
          else
            echo "Gate successfully tripped with exit code 1 as expected."
          fi

      - name: Verify Critical Resource Deletion Blocked (Exit Code 1)
        run: |
          if blast-radius analyze tests/fixtures/delete_with_dependents.json --critical aws_db_instance.primary --fail-on=blocked; then
            echo "Expected gate failure on critical deletion, but command succeeded!"
            exit 1
          else
            echo "Critical resource deletion gate successfully blocked deployment."
          fi
